; Profile: max — validation off entirely. A warm request should barely touch the FS.
; Trade-off: in-place plugin/theme updates require a container restart or opcache
; reset to take effect. That operational cost is part of what E0 is measuring.
;
; Preload is NOT configured here despite the name. opcache.preload_user alone does
; nothing without a paired opcache.preload=<script> - a real preload script needs
; to compile wp-includes and the active plugin set into opcache at FPM startup,
; which is real follow-up work (see hypotheses/H3-opcache-dominates.md), not a
; one-line addition. Do not add opcache.preload_user back without also adding the
; script; a directive that silently does nothing is worse than no directive.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=512
opcache.max_accelerated_files=100000
opcache.interned_strings_buffer=32
realpath_cache_size=32M
realpath_cache_ttl=3600
