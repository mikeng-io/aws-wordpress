# E0 apparatus. Local only, no AWS, no cost. See README.md for method.
#
# SYS_PTRACE + seccomp:unconfined are required for strace to follow php-fpm forks.
# They are scoped to this local experiment and must never appear in deployed apparatus.

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: e0-local-only
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: e0-local-only
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: e0-local-only
      # Selects which php-profiles/*.ini becomes active. Set per-profile by run.sh.
      PROFILE: ${PROFILE:-naive}
    volumes:
      - wpdata:/var/www/html      # survives profile switches, so install/seed runs once
      - ./php-profiles:/php-profiles:ro
      - ./scripts:/scripts:ro
      - ./plugins.txt:/e0/plugins.txt:ro
      - ./out:/out
    healthcheck:
      test: ["CMD-SHELL", "cgi-fcgi -bind -connect 127.0.0.1:9000 </dev/null >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
  wpdata:
