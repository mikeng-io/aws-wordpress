# Viewer-only nginx for looking at the E0 install in a browser.
# Not part of the measurement apparatus - E0 traces bypass this entirely via
# cgi-fcgi straight to the php-fpm socket, deliberately, so nginx never
# contributes syscalls to a trace. This exists only so a human can browse.
server {
    listen 80;
    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
